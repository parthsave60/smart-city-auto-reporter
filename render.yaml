services:
  - type: web
    name: smart-city-classifier-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install --upgrade pip && pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 services.classifier.server:app"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: smart-city-auto-reporter-web
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_CLASSIFIER_API_URL
        value: https://smart-city-classifier-api.onrender.com/api/classify
      - key: VITE_MULTIMODAL_API_URL
        value: https://smart-city-classifier-api.onrender.com/api/multimodal/validate
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyCJguqXOfuQfghz4YOtZQb2FeM5revUqYo
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: smart-city-auto-reporter.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: smart-city-auto-reporter
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: smart-city-auto-reporter.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "609725840696"
      - key: VITE_FIREBASE_APP_ID
        value: "1:609725840696:web:216ba5020f34eddb3c95cd"
      - key: VITE_GOOGLE_MAPS_API_KEY
        value: AIzaSyCJguqXOfuQfghz4YOtZQb2FeM5revUqYo
      - key: VITE_CLOUDINARY_CLOUD_NAME
        value: hnh71stk
      - key: VITE_CLOUDINARY_UPLOAD_PRESET
        value: smart_city_upload
